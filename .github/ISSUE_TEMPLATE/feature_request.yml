name: Unsupported feature
description: A Spanner feature spanbolt doesn't support yet (it returns UNIMPLEMENTED or is missing).
labels: [unimplemented, needs-triage]
body:
  - type: textarea
    id: feature
    attributes:
      label: Spanner feature
      description: What it is, with a link to the Cloud Spanner docs.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What spanbolt does today
      description: The DDL/query/request you tried and the response (often UNIMPLEMENTED).
      render: sql
    validations:
      required: true
  - type: dropdown
    id: emulator
    attributes:
      label: Does the official emulator support it?
      options: ["Yes", "No", "Don't know"]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What you need it for
      description: Your use case helps us prioritise.
