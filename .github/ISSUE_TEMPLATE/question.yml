name: Question
description: How to use spanbolt, whether it fits your setup, or anything that isn't a bug or a missing feature.
labels: [question, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        If spanbolt answers differently from the official emulator, use the bug report instead.
        README.md, docs/ and CONTRIBUTING.md answer most setup questions.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you're trying to do, and your spanbolt version, client library and language if they matter.
