# On a tag vX.Y.Z: publish every crate but spanbolt-conformance to crates.io, in dependency order,
# with trusted publishing (rust-lang/crates-io-auth-action: a short-lived token from GitHub's OIDC
# token, no stored secret). Crates already published at this version are skipped, so a rerun after
# a partial failure picks up where it stopped. workflow_dispatch on a branch is a dry run: it checks
# the versions and packages (and builds) every crate, but publishes nothing.
#
# Trusted publishing works only for crates that exist: the maintainer publishes each crate once by
# hand, then adds this repository, workflow `crates.yml` and environment `crates-io` as its trusted
# publisher on crates.io. docs/releasing.md has the steps.
name: crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      SPANBOLT_CACHE_DIR: ${{ github.workspace }}/.shim-cache
      # Dependency order. googlesql-sys and the spanbolt-* names must match [workspace.dependencies].
      CRATES: >-
        googlesql-sys spanbolt-ddl spanbolt-proto spanbolt-storage spanbolt-txn
        spanbolt-sql spanbolt-server spanbolt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
      - name: Check the versions
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          bad=$(grep -E '^(googlesql-sys|spanbolt-[a-z]+) = \{ path' Cargo.toml | grep -v "version = \"=$version\"" || true)
          if [ -n "$bad" ]; then
            echo "::error::internal deps in [workspace.dependencies] must have version = \"=$version\":"
            echo "$bad"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::notice::dry run on $GITHUB_REF_NAME: would publish $version from $GITHUB_SHA"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1
          fi
      - name: Check the shim pin matches the shim sources
        # A published googlesql-sys can't compare them (it has no native/googlesql).
        run: scripts/package-shim.sh --check
      - name: Download the pinned GoogleSQL shim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . native/googlesql-shim.env
          gh release download "shim-${GOOGLESQL_VERSION}-s${SHIM_VERSION}" -R "$GITHUB_REPOSITORY" \
            -p "googlesql-shim-*-linux-x86_64.tar.gz" -D "$RUNNER_TEMP/shim"
          echo "SPANBOLT_SHIM_URL=file://$RUNNER_TEMP/shim" >> "$GITHUB_ENV"
      - name: Package and build every crate
        # Builds each .crate against the others (cargo resolves the unpublished ones locally), the
        # same check `cargo publish` makes, once for all of them.
        run: cargo package --workspace --locked --exclude spanbolt-conformance
      - name: Get a crates.io token
        if: github.ref_type == 'tag'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          for crate in $CRATES; do
            # The sparse index lists every published version (path: index.crates.io/sp/an/<name>).
            index="https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate"
            if curl -fsS "$index" 2>/dev/null | grep -q "\"vers\":\"$version\""; then
              echo "$crate $version is on crates.io already"
              continue
            fi
            # Verified by `cargo package` above; cargo waits until each crate is in the index.
            cargo publish --locked --no-verify -p "$crate"
          done
