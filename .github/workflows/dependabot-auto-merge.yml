# Turns on squash auto-merge for Dependabot minor and patch updates, in every ecosystem (cargo,
# docker, github-actions), so each lands as soon as the required checks pass. A PR whose checks fail
# stays open for a maintainer (or the scheduled triage) to fix.
#
# Major updates are left alone: the triage verifies, adapts and merges them. Many actions only run
# in image.yml, shim.yml and release.yml on main or tags, so PR CI alone says little about a major
# bump; those workflows take workflow_dispatch on a PR branch for that.
# "Major" follows semver: X in X.y.z changes, or for 0.y.z the y changes. Grouped PRs
# ("bump the <group> group ...") are minor/patch only by dependabot.yml, so they auto-merge. A
# single-update title without a readable "from X to Y" is left for the triage too.
name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Only minor and patch updates
        id: policy
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          merge=false
          re='from v?([0-9]+)\.?([0-9]*)[^ ]* to v?([0-9]+)\.?([0-9]*)'
          if [[ "$TITLE" =~ $re ]]; then
            from_major=${BASH_REMATCH[1]} from_minor=${BASH_REMATCH[2]:-0}
            to_major=${BASH_REMATCH[3]} to_minor=${BASH_REMATCH[4]:-0}
            merge=true
            if [ "$from_major" != "$to_major" ]; then
              merge=false
            elif [ "$from_major" = 0 ] && [ "$from_minor" != "$to_minor" ]; then
              merge=false
            fi
          elif [[ "$TITLE" == *"bump the "*" group "* ]]; then
            merge=true
          fi
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          if [ "$merge" = false ]; then
            echo "::notice::major (or unreadable) update, not auto-merging: $TITLE"
            echo "Major update: left for the triage to verify, adapt and merge." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enable auto-merge
        if: steps.policy.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
