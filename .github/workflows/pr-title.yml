# PRs are squash-merged with the PR title as the commit message, so the title must be a
# conventional commit: type(scope): description (CONTRIBUTING.md).
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title \"$TITLE\" is not a conventional commit."
            echo "Use type(scope): description, e.g. fix(sql): keep NULLs last in DESC order."
            echo "Types: feat fix perf refactor docs test ci build chore revert. Add ! for a breaking change."
            exit 1
          fi
          echo "ok: $TITLE"
