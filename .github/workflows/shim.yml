# Builds the GoogleSQL shim per platform with Bazel and, on a tag
# shim-<GOOGLESQL_VERSION>-s<SHIM_VERSION>, publishes the archives as that release's assets.
# Afterwards pin them: download the *.sha256 assets, `scripts/package-shim.sh --pin-sums DIR`,
# and commit native/googlesql-shim.env (docs/building.md).
name: shim

on:
  push:
    tags: ["shim-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTOC_VERSION: "31.1"

jobs:
  build:
    name: shim (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux shim needs glibc 2.38+ at run time; build it on Ubuntu 24.04 like the Dockerfile.
          - { platform: linux-x86_64, runner: ubuntu-24.04, protoc: linux-x86_64 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, protoc: linux-aarch_64 }
          - { platform: darwin-arm64, runner: macos-15, protoc: osx-aarch_64 }
    runs-on: ${{ matrix.runner }}
    # 2 jobs everywhere: the macos-15 runner has 3 vCPU and 7 GB, and a third compile only swaps.
    # Cold: ~25 min on a 12-core Mac, about 90 min on a standard 8 GB Linux runner at 2 jobs
    # (peak swap ~7.5 GB).
    timeout-minutes: 360
    steps:
      # A standard Linux runner has 8 GB of RAM, and two of googlesql's generated sources compiling
      # at once (resolved_ast*.cc, 5+ GB each) run it out of memory: the runner shut down without an
      # error from Bazel. Make room on disk, then add swap so a peak spills instead of killing it.
      - name: Free disk and add swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          # /mnt (the x86_64 runners' scratch disk) when it has room, else the root disk.
          dir=/
          if [ -d /mnt ] && [ "$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)" -gt 40 ]; then dir=/mnt; fi
          sudo fallocate -l 16G "$dir/spanbolt-swap"
          sudo chmod 600 "$dir/spanbolt-swap"
          sudo mkswap "$dir/spanbolt-swap"
          sudo swapon "$dir/spanbolt-swap"
          free -h
          df -h / /mnt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the tag matches native/googlesql-shim.env
        if: github.ref_type == 'tag'
        run: |
          . native/googlesql-shim.env
          want="shim-${GOOGLESQL_VERSION}-s${SHIM_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but native/googlesql-shim.env says $want"; exit 1
          fi
      - name: Install clang 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18
      - name: Install protoc
        env:
          PROTOC_PLATFORM: ${{ matrix.protoc }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${PROTOC_PLATFORM}.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      # Restore and save separately: the cache is saved even when the build fails or is cancelled,
      # so a rerun resumes where the last one stopped.
      - name: Restore the Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spanbolt-bazel-disk
          key: bazel-disk-${{ matrix.platform }}-${{ hashFiles('native/googlesql/**') }}
          restore-keys: bazel-disk-${{ matrix.platform }}-
      - name: Build the shim
        working-directory: native/googlesql
        run: |
          # Memory bounds this build: ~5 GB per compile job on googlesql's generated sources.
          jobs=2
          extra=()
          if [ "$RUNNER_OS" = Linux ]; then
            extra=(--repo_env=CC=clang-18 --repo_env=CXX=clang++-18)
            # The Android SDK was deleted above; with ANDROID_HOME still set, rules_android's SDK
            # repository fails analysis.
            unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
          fi
          # Memory and disk every minute, for the log, so the next failure says what ran out.
          if [ "$RUNNER_OS" = Linux ]; then
            (while sleep 60; do
               free -m | awk '/Mem:/{m="mem avail " $7 "M"} /Swap:/{s="swap used " $3 "M"} END{printf "resources: %s, %s, ", m, s}'
               df -m / | awk 'NR==2{print "disk free " $4 "M"}'
             done) &
          fi
          bazel build --jobs="$jobs" "${extra[@]}" //:libgooglesql_shim.so
      - name: Save the Bazel disk cache
        if: always() && steps.disk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/spanbolt-bazel-disk
          key: bazel-disk-${{ matrix.platform }}-${{ hashFiles('native/googlesql/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/package-shim.sh --platform "$PLATFORM" --out dist
      - name: Compare with the pinned checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          . native/googlesql-shim.env
          var="SHA256_$(echo "$PLATFORM" | tr - _)"
          pinned="${!var}"
          read -r got _ < dist/*.sha256
          if [ -n "$pinned" ] && [ "$pinned" != "$got" ]; then
            echo "::warning::built $got, native/googlesql-shim.env pins $pinned; pin the release's checksums"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shim-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shim-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "GoogleSQL shim $GITHUB_REF_NAME" \
              --notes "Prebuilt GoogleSQL shim archives for googlesql-sys (docs/building.md)."
          fi
