[workspace]
resolver = "3"
members = ["crates/*"]
# googlesql-sys needs the Bazel-built native library (native/googlesql); build it explicitly with -p.
default-members = ["crates/proto", "crates/storage", "crates/txn", "crates/ddl", "crates/server", "crates/conformance"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "Apache-2.0"
repository = "https://github.com/strise/spanbolt"
homepage = "https://strise.github.io/spanbolt/"
keywords = ["spanner", "emulator", "googlesql", "testing", "grpc"]
categories = ["database", "development-tools::testing", "emulators"]

[workspace.dependencies]
spanbolt-ddl = { path = "crates/ddl" }
spanbolt-proto = { path = "crates/proto" }
spanbolt-storage = { path = "crates/storage" }
spanbolt-txn = { path = "crates/txn" }
arc-swap = "1.9"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dashmap = "6"
imbl = "7"
parking_lot = "0.12"
prost = "0.14"
prost-types = "0.14"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
zstd = "0.14"
