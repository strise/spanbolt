[workspace]
resolver = "3"
members = ["crates/*"]
# googlesql-sys, spanbolt-sql and spanbolt (the binary, SQL engine on) need the GoogleSQL shim
# (native/googlesql, docs/building.md); build them explicitly with -p.
default-members = ["crates/proto", "crates/storage", "crates/txn", "crates/ddl", "crates/server", "crates/conformance"]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "Apache-2.0"
repository = "https://github.com/strise/spanbolt"
homepage = "https://strise.github.io/spanbolt/"
keywords = ["spanner", "emulator", "googlesql", "testing", "grpc"]
categories = ["database", "development-tools::testing", "emulators"]
rust-version = "1.91"

[workspace.dependencies]
# Internal crates: `version` is what the published crates depend on (keep it equal to the
# workspace version; docs/releasing.md).
googlesql-sys = { path = "crates/googlesql-sys", version = "=0.3.0" }
spanbolt-ddl = { path = "crates/ddl", version = "=0.3.0" }
spanbolt-proto = { path = "crates/proto", version = "=0.3.0" }
spanbolt-server = { path = "crates/server", version = "=0.3.0" }
spanbolt-sql = { path = "crates/sql", version = "=0.3.0" }
spanbolt-storage = { path = "crates/storage", version = "=0.3.0" }
spanbolt-txn = { path = "crates/txn", version = "=0.3.0" }
arc-swap = "1.9"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dashmap = "6"
imbl = "7"
# The binary's allocator (crates/spanbolt). v2: on single-row commits v3 was ~0.5µs slower than glibc.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
parking_lot = "0.12"
prost = "0.14"
prost-types = "0.14"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
zstd = "0.14"
