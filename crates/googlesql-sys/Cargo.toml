[package]
name = "googlesql-sys"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Rust bindings to a C++ shim around Google's GoogleSQL analyser."
repository.workspace = true
homepage.workspace = true
keywords = ["googlesql", "sql", "parser", "ffi", "spanner"]
categories = ["external-ffi-bindings", "database", "parser-implementations"]
rust-version.workspace = true
documentation = "https://docs.rs/googlesql-sys"
readme = "README.md"
links = "googlesql_shim"
# The pinned archive list is a symlink to native/googlesql-shim.env; cargo package stores its
# contents. Bazel sources stay out: a packaged build always uses a prebuilt or given shim.
include = ["build.rs", "src/**", "googlesql-shim.env", "README.md", "LICENSE", "NOTICE"]

[package.metadata.docs.rs]
# docs.rs has no network: build.rs skips the shim there and the resolved-AST types are empty.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
prost-types.workspace = true
prost.workspace = true
serde_json.workspace = true

[build-dependencies]
prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
sha2 = "0.11"
