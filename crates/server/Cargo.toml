[package]
name = "spanbolt-server"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "spanbolt: a fast drop-in replacement for the Google Cloud Spanner emulator, for tests and CI."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "spanbolt"
path = "src/main.rs"

[dependencies]
spanbolt-ddl.workspace = true
spanbolt-proto.workspace = true
spanbolt-storage.workspace = true
spanbolt-txn.workspace = true
spanbolt-sql = { path = "../sql", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap.workspace = true
dashmap.workspace = true
http-body = "1"
# The binary's allocator (src/main.rs). v2: on single-row commits v3 was ~0.5µs slower than glibc.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
parking_lot.workspace = true
prost.workspace = true
prost-types.workspace = true
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower-layer = "0.3"

[features]
# The GoogleSQL-backed SQL engine; needs the native shim (scripts/googlesql-env.sh).
googlesql = ["dep:spanbolt-sql"]

[dev-dependencies]
spanbolt-storage.workspace = true
h2 = "0.4"
http = "1"

[[example]]
name = "sql_bench"
required-features = ["googlesql"]

[[example]]
name = "search_bench"
required-features = ["googlesql"]

[[example]]
name = "soak"
required-features = ["googlesql"]

[[example]]
name = "insert_bench"
required-features = ["googlesql"]
