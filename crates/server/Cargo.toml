[package]
name = "spanbolt-server"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The spanbolt Spanner emulator as a library: gRPC services, REST gateway and streaming. The binary is the `spanbolt` crate."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/spanbolt-server"
readme = "README.md"
include = ["build.rs", "src/**", "README.md", "LICENSE", "NOTICE"]

[dependencies]
spanbolt-ddl.workspace = true
spanbolt-proto.workspace = true
spanbolt-storage.workspace = true
spanbolt-txn.workspace = true
spanbolt-sql = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap.workspace = true
dashmap.workspace = true
http-body = "1"
parking_lot.workspace = true
prost.workspace = true
prost-types.workspace = true
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower-layer = "0.3"

[features]
# The GoogleSQL-backed SQL engine; needs the native shim (scripts/googlesql-env.sh).
googlesql = ["dep:spanbolt-sql"]

[dev-dependencies]
spanbolt-storage.workspace = true
mimalloc.workspace = true
h2 = "0.4"
http = "1"

[[example]]
name = "sql_bench"
required-features = ["googlesql"]

[[example]]
name = "search_bench"
required-features = ["googlesql"]

[[example]]
name = "soak"
required-features = ["googlesql"]

[[example]]
name = "insert_bench"
required-features = ["googlesql"]
